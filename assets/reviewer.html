<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 问 · 人工审核</title>
<style>
:root{color-scheme:dark;--bg:#101617;--surface:#192224;--line:#334447;--muted:#9db0b1;--text:#edf3f1;--accent:#a4e3c4;--warn:#f3cc91;--bad:#f2a9a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 'Microsoft YaHei',system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:36px 28px 90px}.eyebrow{letter-spacing:.18em;color:var(--accent);font-size:12px}h1{font-size:32px;margin:8px 0 6px;font-weight:600}p{margin:8px 0}.muted{color:var(--muted)}.lead{max-width:800px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.metric{border:1px solid var(--line);padding:16px 20px;border-radius:10px;background:var(--surface)}.metric b{display:block;font-size:30px;line-height:1.3;font-weight:500}.metric span{font-size:12px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:3;background:#101617f5;border-block:1px solid var(--line);padding:14px 0;backdrop-filter:blur(12px)}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.bar+.bar{margin-top:10px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:6px;background:#101819;color:var(--text);padding:8px 10px}input[type=checkbox]{accent-color:var(--accent)}input[type=search]{flex:1;min-width:180px}input[type=text]{max-width:190px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#12241b;font-weight:600}button:disabled{opacity:.4;cursor:default}.attest{font-size:13px;color:var(--muted)}.run{font:12px/1.8 ui-monospace,monospace;overflow-wrap:anywhere;color:var(--muted)}.card{margin-top:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}.card.pass{border-left:3px solid var(--accent)}.card.correct{border-left:3px solid #8ebce8}.card.reject{border-left:3px solid var(--bad)}.head{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px}.badge{color:var(--accent);font-family:ui-monospace,monospace}.status{margin-left:auto;color:var(--muted)}.body{padding:18px 20px}.label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.question{font-size:17px;margin:0 0 18px;white-space:pre-wrap}.original{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;background:#101819;border:1px solid #2b3b3e;padding:14px;border-radius:6px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.review-fields{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.scores{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}.scores label{font-size:13px}.scores select{padding:5px;margin-left:8px}textarea{width:100%;resize:vertical;min-height:112px;line-height:1.7}.smallarea{min-height:60px}.block{margin-top:12px}.warn{color:var(--warn)}.bad{color:var(--bad)}.good{color:var(--accent)}details{font-size:13px;color:var(--muted);margin-bottom:12px}details pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}summary{cursor:pointer}.foot{font-size:12px;color:var(--muted);margin-top:8px}.empty{padding:50px;text-align:center;color:var(--muted)}#message{min-height:24px;margin-top:10px;font-size:13px}a{color:var(--accent)}@media(max-width:760px){main{padding:22px 14px 60px}.summary{grid-template-columns:1fr 1fr}.columns{grid-template-columns:1fr}.toolbar{position:static}h1{font-size:27px}.body,.head{padding:14px}.bar input[type=text]{max-width:none}}
</style></head><body><main>
<div class="eyebrow">DEAI DIALOGUE / HUMAN REVIEW</div><h1>让每一句，经过人来判断。</h1>
<p class="lead muted">逐条看 bot 的原始回答。可以保留、亲手改写或拒绝。自动采集完成只代表有了回答，只有人工签认的样本才会进入回填文件。</p>
<p id="run" class="run"></p><div id="metrics" class="summary"></div>
<section class="toolbar"><div class="bar"><select id="filter" aria-label="筛选状态"><option value="all">全部 100 题</option><option value="pending">待人工审核</option><option value="correct">已人工纠正</option><option value="pass">原句通过</option><option value="reject">拒绝 / 需重做</option><option value="error">采集未成功</option></select><select id="category" aria-label="筛选类别"><option value="">全部场景</option></select><input id="search" type="search" placeholder="搜索题号或问题" aria-label="搜索题号或问题"></div>
<div class="bar"><label>审核人 <input id="reviewer" type="text" placeholder="由实际审核人填写" autocomplete="name"></label><label class="attest"><input id="attest" type="checkbox"> 我已亲自审阅已标记的条目，签认不是由 AI 代填</label><button id="export" class="primary">导出人工审核 JSON</button><button id="import">继续已有审核</button><input id="file" type="file" accept="application/json,.json" hidden></div>
<div id="message" role="status"></div><div class="foot">草稿尽可能保存在此浏览器本地。换浏览器或电脑前请导出 JSON；本页不上传数据，也不自动修改 bot。评分针对最终接受的句子，修改原因记录原句的问题。</div></section>
<div id="cards"></div><p class="foot">通过门槛：自然度、贴合度、正确性均为 3–5 分。选择纠正时填写修正版、原因和适用范围。拒绝条目不会进入示例，也会阻止整轮验收。</p>
</main>
<script id="run-data" type="application/json">__RUN_DATA__</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById('run-data').textContent), records=DATA.records, meta=DATA.manifest;
const $=id=>document.getElementById(id), key='deai-human-review:'+meta.run_id;
const labels={pending:'待人工审核',pass:'原句通过',correct:'人工纠正',reject:'拒绝 / 需重做'};
const drafts=Object.fromEntries(records.map(r=>[r.id,{id:r.id,answer_sha256:r.answer_sha256,decision:'pending',scores:{naturalness:null,relevance:null,correctness:null},corrected_action:r.action||'reply',corrected_text:r.answer||'',reason:'',scope:'',reviewed_at:null}]));
function message(text,bad=false){$('message').textContent=text;$('message').className=bad?'bad':'good'}
function documentValue(){return {schema_version:1,run_id:meta.run_id,prompt_sha256:meta.prompt_sha256,questions_sha256:meta.questions_sha256,reviewer:$('reviewer').value.trim(),manual_attestation:$('attest').checked,exported_at:new Date().toISOString(),reviews:records.map(r=>drafts[r.id])}}
function restore(data){if(data.schema_version!==1||data.run_id!==meta.run_id||data.prompt_sha256!==meta.prompt_sha256||data.questions_sha256!==meta.questions_sha256)throw Error('审核不属于本次运行。');if(!Array.isArray(data.reviews)||data.reviews.length!==100||new Set(data.reviews.map(r=>r.id)).size!==100)throw Error('审核文件应有一百个唯一编号。');for(const row of data.reviews){if(!drafts[row.id]||row.answer_sha256!==drafts[row.id].answer_sha256)throw Error('原始回答已变化，不能套用这份审核。');if(!Object.hasOwn(labels,row.decision))throw Error('审核状态无效。')}for(const row of data.reviews)drafts[row.id]={...drafts[row.id],...row};$('reviewer').value=typeof data.reviewer==='string'?data.reviewer:'';$('attest').checked=false}
function save(){try{localStorage.setItem(key,JSON.stringify(documentValue()))}catch{message('浏览器无法保存草稿，请及时导出 JSON。',true)}updateMetrics()}
function update(r,field,value){const d=drafts[r.id];if(field.startsWith('scores.'))d.scores[field.slice(7)]=value;else d[field]=value;d.reviewed_at=d.decision==='pending'?null:new Date().toISOString();save();const card=$('card-'+r.id);if(card){card.className='card '+d.decision;card.querySelector('.status').textContent=labels[d.decision]}}
function updateMetrics(){const vals=Object.values(drafts),pending=vals.filter(d=>d.decision==='pending').length,correct=vals.filter(d=>d.decision==='correct').length,accepted=vals.filter(d=>d.decision==='pass'||d.decision==='correct').length;const info=[[records.filter(r=>r.status==='ok').length+'/100','实际回答已采集'],[pending,'待人工审核'],[correct,'人工修正'],[accepted+'/100','已标记接受，导出时校验']];$('metrics').replaceChildren(...info.map(([n,t])=>{const div=document.createElement('div');div.className='metric';const b=document.createElement('b');b.textContent=n;const s=document.createElement('span');s.textContent=t;div.append(b,s);return div}))}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function field(title,node){const label=el('label','block');label.append(el('span','label',title),node);return label}
function select(options,value,onchange){const s=document.createElement('select');for(const [v,t]of options){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}s.value=value==null?'':String(value);s.addEventListener('change',()=>onchange(s.value));return s}
function area(value,oninput,small=false){const t=document.createElement('textarea');t.value=value||'';if(small)t.className='smallarea';t.addEventListener('input',()=>oninput(t.value));return t}
function render(){const needle=$('search').value.trim().toLowerCase(),filter=$('filter').value,category=$('category').value;const shown=records.filter(r=>{const d=drafts[r.id];return(!category||r.category===category)&&(!needle||(r.id+' '+r.input).toLowerCase().includes(needle))&&(filter==='all'||(filter==='error'?r.status!=='ok':d.decision===filter))});const fragment=document.createDocumentFragment();for(const r of shown){const d=drafts[r.id],card=el('article','card '+d.decision);card.id='card-'+r.id;const head=el('div','head');head.append(el('span','badge',r.id),el('span','',r.category+(r.session?' · '+r.session+' / '+r.turn:'')),el('span','status',labels[d.decision]));const body=el('div','body');body.append(el('span','label','当前问题 / 发言'),el('p','question',r.input));if(r.context?.length||r.history?.length||r.fixture){const details=el('details');details.append(el('summary','','查看上下文和测试夹具'));if(r.fixture)details.append(el('pre','','可信合成夹具：'+r.fixture));if(r.context?.length)details.append(el('pre','','合成聊天：\n'+r.context.map(c=>c.speaker+'：'+c.text).join('\n')));if(r.history?.length)details.append(el('pre','','本会话实际历史：\n'+r.history.map(m=>{let t=m.content;try{const v=JSON.parse(t);if(v.action)t=v.action==='no_reply'?'[保持沉默]':v.text}catch{}return m.role+'：'+t}).join('\n')));body.append(details)}const columns=el('div','columns'),left=el('div'),right=el('div');left.append(el('span','label','bot 原始回答 · 保持不变'),el('div','original',r.status==='ok'?(r.action==='no_reply'?'[保持沉默，没有发送文字]':r.answer):'[尚无有效回答：'+r.status+']'));if(r.status!=='ok')left.append(el('p','warn','此条不能审核通过。请先恢复采集。'));right.append(el('span','label','人工决定'));const decision=select(Object.entries(labels),d.decision,v=>{update(r,'decision',v);render()});decision.disabled=r.status!=='ok';right.append(decision);const scoreRow=el('div','scores');for(const [code,name]of [['naturalness','自然度'],['relevance','贴合度'],['correctness','正确性']]){const label=el('label','',name);label.append(select([['','未评分'],...[1,2,3,4,5].map(i=>[String(i),String(i)])],d.scores[code],v=>update(r,'scores.'+code,v?Number(v):null)));scoreRow.append(label)}right.append(scoreRow);columns.append(left,right);body.append(columns);const fields=el('div','review-fields');if(d.decision==='correct'){fields.append(field('纠正后的行为',select([['reply','发出文字'],['no_reply','保持沉默']],d.corrected_action,v=>{update(r,'corrected_action',v);if(v==='no_reply')update(r,'corrected_text','');render()})));if(d.corrected_action==='reply')fields.append(field('人工修正版',area(d.corrected_text,v=>update(r,'corrected_text',v))));fields.append(field('这处改动适用于什么场景？',area(d.scope,v=>update(r,'scope',v),true)))}if(d.decision==='correct'||d.decision==='reject')fields.append(field('具体原因：哪句话有什么问题？',area(d.reason,v=>update(r,'reason',v),true)));if(fields.children.length)body.append(fields);const tips=el('details','block');tips.append(el('summary','','需要时查看本题审核考点'),el('p','',r.focus));body.append(tips);card.append(head,body);fragment.append(card)}$('cards').replaceChildren(fragment);if(!shown.length)$('cards').append(el('div','empty','当前筛选没有条目。'));updateMetrics()}
function validateExport(data){if(!data.reviewer)throw Error('请由实际审核人填写姓名。');if(!data.manual_attestation)throw Error('导出人工结果前，请亲自确认签认声明。');for(const d of data.reviews){if(d.decision==='pending')continue;const r=records.find(r=>r.id===d.id);if(r.status!=='ok')throw Error(d.id+' 尚未成功采集。');if(d.decision==='reject'){if(!d.reason.trim())throw Error(d.id+' 需要拒绝原因。');continue}if(Object.values(d.scores).length!==3||Object.values(d.scores).some(v=>!Number.isInteger(v)||v<3||v>5))throw Error(d.id+' 通过前需要三个 3–5 分的评分。');if(d.decision==='correct'){if(!d.reason.trim()||!d.scope.trim())throw Error(d.id+' 需要修改原因和适用范围。');if(d.corrected_action==='reply'&&!d.corrected_text.trim())throw Error(d.id+' 修正版不能为空。');if(d.corrected_action===r.action&&d.corrected_text===r.answer)throw Error(d.id+' 没有实际修改，原句合格请选择原句通过。')}}}
$('export').addEventListener('click',()=>{try{const data=documentValue();validateExport(data);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='human-review.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);message('已导出。将此 JSON 交给 compile 命令校验并生成回填文件。');save()}catch(e){message(e.message,true)}});
$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async()=>{try{const file=$('file').files[0];if(!file)return;restore(JSON.parse(await file.text()));save();render();message('已载入审核。导出时需由实际审核人再次勾选签认。')}catch(e){message(e.message,true)}});
for(const id of ['filter','category'])$(id).addEventListener('change',render);$('search').addEventListener('input',render);$('reviewer').addEventListener('input',save);$('attest').addEventListener('change',save);
for(const name of new Set(records.map(r=>r.category))){const o=document.createElement('option');o.value=name;o.textContent=name;$('category').append(o)}
$('run').textContent='运行 '+meta.run_id+' · 提示词 '+meta.prompt_sha256.slice(0,12)+' · '+meta.evaluation_scope;
try{const stored=localStorage.getItem(key);if(stored){restore(JSON.parse(stored));message('已恢复本地草稿。人工签认需重新确认。')}}catch(e){message('未恢复草稿：'+e.message,true)}render();
</script></body></html>
